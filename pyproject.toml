[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rescat"
version = "1.0.0"
description = "Universal Offline Ransomware Analysis, Cryptanalysis & Decryptor Suite"
readme = "README.md"
authors = [
    { name = "Eren Söğütlü", email = "sogutlueren@gmail.com" }
]
requires-python = ">=3.8"
keywords = [
    "ransomware", "decryptor", "cryptanalysis", "dfir",
    "incident-response", "malware-analysis", "forensics", "aes",
    "chacha20", "x25519", "openssl", "lockbit", "vmdk"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Recovery Tools",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = [
    "cryptography>=41.0.0"
]

[project.urls]
Homepage = "https://github.com/erensogutlu/rescat"
Repository = "https://github.com/erensogutlu/rescat.git"
Issues = "https://github.com/erensogutlu/rescat/issues"
Changelog = "https://github.com/erensogutlu/rescat/blob/main/CHANGELOG.md"

[project.scripts]
rescat = "rescat.ana_komut:ana_calistirici"

[tool.setuptools.packages.find]
where = ["."]
include = ["rescat*"]
exclude = ["testler*"]
